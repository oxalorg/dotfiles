# Dotfiles symlink configuration
# Each section defines a symlink mapping:
#   source = path relative to this dotfiles repo
#   target = default target path (used on Linux)
#   target_macos = macOS-specific target path (optional, falls back to target)

[zshrc]
source = shell/zshrc
target = ~/.zshrc

[bashrc]
source = shell/bashrc
target = ~/.bashrc

[tmux]
source = tmux/.tmux.conf
target = ~/.tmux.conf

[ghostty]
source = ghostty
target = ~/.config/ghostty
target_macos = ~/Library/Application Support/com.mitchellh.ghostty

[kitty]
source = kitty
target = ~/.config/kitty

[nvim]
source = nvim
target = ~/.config/nvim

[systemd]
source = systemd
target = ~/.config/systemd

[mpv]
source = mpv
target = ~/.config/mpv

[mpv-bin]
source = mpv/mpv
target = ~/.local/bin/mpv

[hawtkeys-udev]
source = etc/udev/rules.d/99-hawtkeys-shorty.rules
target = /etc/udev/rules.d/99-hawtkeys-shorty.rules

# Shared agent instructions: one file for every coding agent
[agents-md-claude]
source = agents/AGENTS.md
target = ~/.claude/CLAUDE.md

[agents-md-codex]
source = agents/AGENTS.md
target = ~/.codex/AGENTS.md

[agents-md-pi]
source = agents/AGENTS.md
target = ~/.pi/agent/AGENTS.md

[agents-md-shared]
source = agents/AGENTS.md
target = ~/.agents/AGENTS.md

# Shared skills: ~/.agents/skills (npx skills, Codex) and ~/.claude/skills
[agents-skills]
source = agents/skills
target = ~/.agents/skills

[claude-skills]
source = agents/skills
target = ~/.claude/skills

[agents-skill-lock]
source = agents/skill-lock.json
target = ~/.agents/.skill-lock.json

# Claude Code user config
[claude-settings]
source = claude/settings.json
target = ~/.claude/settings.json

[claude-commands]
source = claude/commands
target = ~/.claude/commands

# Codex user config
[codex-hooks]
source = codex/hooks.json
target = ~/.codex/hooks.json

[codex-rules]
source = codex/rules
target = ~/.codex/rules

[scripts-bin]
mode = flatten
source = scripts
target = ~/.local/bin
exclude = README.md, setup.sh, *archived*
executable = true
skip_macos = pbcopy, pbpaste
prune = true
